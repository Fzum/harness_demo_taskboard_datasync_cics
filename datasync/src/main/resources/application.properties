spring.application.name=taskboard-datasync
server.port=8081

# The shared Taskboard database. Locally that is the backend's in-memory H2 (MODE=DB2), reached
# through the H2 TCP server the backend starts on port 9092; in production the same Db2 database
# the backend uses. The backend owns the schema: the datasync never migrates it.
spring.datasource.url=jdbc:h2:tcp://localhost:9092/mem:taskboard;MODE=DB2
spring.datasource.username=sa
spring.datasource.password=

# The CICS host; locally the CICS host simulator
datasync.host.base-url=http://localhost:8090
datasync.host.connect-timeout=2s
datasync.host.read-timeout=10s

# Pull ETL, host to Db2: a full sync, first at start-up, then with this delay between runs
datasync.etl.interval=60s

# Outbox relay, Db2 to host: first at start-up, then with this delay between runs
datasync.outbox.interval=30s
datasync.outbox.batch-size=100
datasync.outbox.max-attempts=5

# Two scheduler threads, so that the ETL and the relay never delay each other
spring.task.scheduling.pool.size=2

# /actuator/health covers the app and its database, not the host: show which components count
management.endpoint.health.show-components=always

spring.mvc.problemdetails.enabled=true
