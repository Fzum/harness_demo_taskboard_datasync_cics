# The tests use their own embedded H2 (MODE=DB2) with a verbatim copy of the Taskboard schema,
# and the in-process HostStub instead of the CICS host (DatasyncTestConfiguration sets
# datasync.host.base-url). They never need the backend or the simulator.
spring.datasource.url=jdbc:h2:mem:datasync-${random.uuid};MODE=DB2;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/taskboard-schema.sql

# The tests run the ETL and the relay themselves.
datasync.scheduling.enabled=false
